<!doctype html>
<html>
  <head>
    <title>User Registration</title>
    <link rel="stylesheet" type="text/css" href="https://cdnjs.cloudflare.com/ajax/libs/semantic-ui/2.1.8/semantic.min.css">
    <style>
      body {
        background: #f9f9f9;
        padding: 40px;
      }
      .ui.form {
        max-width: 400px;
        margin: 40px auto;
        background: #fff;
        padding: 2em 2em 1em 2em;
        border-radius: 8px;
        box-shadow: 0 2px 8px rgba(0,0,0,0.08);
      }
    </style>
  </head>
  <body>
    <nav class="ui fixed menu inverted navbar">
      <a href="#" class="brand item">King of the Hill</a>
      <a id="network_nav" href="/#network" class="active item">Network</a>
      <a id="graph_nav" href="/#graph" class="item">Graph</a>
      <a id="ports_nav" href="/#ports" class="item">Ports</a>
      <a id="register_nav" href="register.html" class="item">Register</a>
      <a id="login_nav" href="login.html" class="item">Sign In</a>
      <a id="scoreboard_nav" href="scoreboard.html" class="item">Scoreboard</a>
      </nav>
    
    <h2 class="ui dividing header">
      <i class="user plus icon"></i>
      <div class="content">
        Create Account
      </div>
    </h2>
    <form class="ui form" id="registerForm">
      <div class="field">
        <label>Username</label>
        <input type="text" name="username" placeholder="Enter username" required>
      </div>
      <button class="ui primary button" type="submit">Register</button>
    </form>
    <div id="message" class="ui message" style="display:none;"></div>
    <div style="margin-top: 1em;">
      <a href="login.html">Already have an account? Sign in</a>
    </div>
    <script>
      document.getElementById('registerForm').addEventListener('submit', function(e) {
        e.preventDefault();
        const form = e.target;
        const username = form.username.value;
        fetch('/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username })
        })
        .then(async response => {
          const text = await response.text();
          document.getElementById('message').style.display = 'block';
          if (response.ok) {
            document.getElementById('message').className = 'ui positive message';
            document.getElementById('message').textContent = text;
            form.reset();
          } else {
            document.getElementById('message').className = 'ui negative message';
            document.getElementById('message').textContent = text;
          }
        })
        .catch(err => {
          document.getElementById('message').style.display = 'block';
          document.getElementById('message').className = 'ui negative message';
          document.getElementById('message').textContent = 'Registration failed. Please try again.';
        });
      });
    </script>
  </body>
</html>
