<!doctype html>
<html>
    <head>
        <style>
            .red {
                color: red;
            }
            .green {
                color: green;
            }
            body {
                overflow:hidden;
            }
            .machine_row:hover {
                cursor: pointer;
            }
            #graph {
                margin: 20px;
                height: 65%;
                width: calc(100% - 100px);
                display: none;
            }
            #cy {
                width: 100%;
            }
            #cy, #graph, #ports {
                height: 100%;

                position: absolute;
                left: 0;
                top: 40px;
            }
            #ports {
                margin: 20px;
                width: calc(100% - 40px);
                height: calc(100% - 100px);
                overflow-y: auto;
                display: none;
            }
            #myChart {
                height: 100%;
                width: 100%;
            }
            #messages {
                max-height: 20%;
                width: 100%;
                position: absolute;
                bottom:0;
                left:0;
                margin: 0;
                overflow:hidden;
                overflow-y: auto;
            }
            .ui.header.small {
                font-size: 14px;
            }
            .nav {
                position:absolute;
                top:0;
            }
        </style>
        <link rel="stylesheet" type="text/css" href="https://cdnjs.cloudflare.com/ajax/libs/qtip2/2.2.0/jquery.qtip.css">
        <link rel="stylesheet" type="text/css" href="https://cdnjs.cloudflare.com/ajax/libs/semantic-ui/2.1.8/semantic.min.css">
        <link rel="stylesheet" type="text/css" href="https://cdnjs.cloudflare.com/ajax/libs/c3/0.4.10/c3.min.css">
        <link rel="stylesheet" type="text/css" href="https://cdnjs.cloudflare.com/ajax/libs/toastr.js/latest/css/toastr.min.css">
        <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
        <script src="https://ajax.googleapis.com/ajax/libs/jquery/1/jquery.min.js"></script>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/qtip2/2.2.0/jquery.qtip.js"></script>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/semantic-ui/2.1.8/semantic.min.js"></script>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/toastr.js/latest/js/toastr.min.js"></script>
        <script src="static/js/cytoscape.min.js"></script>
        <script src="https://cdn.rawgit.com/cytoscape/cytoscape.js-qtip/2.2.5/cytoscape-qtip.js"></script>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/d3/3.5.16/d3.min.js"></script>
        <script src="https://cdn.rawgit.com/cytoscape/cytoscape.js-springy/master/cytoscape-springy.js"></script>
        <script src="https://cdn.rawgit.com/cytoscape/cytoscape.js-cose-bilkent/2dc34feda3abb1845e68448cb1bb0813695d92bf/cytoscape-cose-bilkent.js"></script>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/c3/0.4.10/c3.min.js"></script>
        <script src="static/js/dummy.js"></script>
        <script>
            var api;
            var initialized = false;
            var DEMO_MODE = false;
            $( document ).ready(function() {
                toastr.options = {
                  "closeButton": true,
                  "debug": true,
                  "newestOnTop": true,
                  "progressBar": true,
                  "positionClass": "toast-top-right",
                  "preventDuplicates": false,
                  "onclick": null,
                  "showDuration": "300",
                  "hideDuration": "1000",
                  "timeOut": "5000",
                  "extendedTimeOut": "1000",
                  "showEasing": "swing",
                  "hideEasing": "linear",
                  "showMethod": "fadeIn",
                  "hideMethod": "fadeOut"
                }
                $("#network_nav").click(function() {
                    $("#graph").hide();
                    $("#ports").hide();
                    $("#cy").show();
                    $("#graph_nav").removeClass("active");
                    $("#ports_nav").removeClass("active");
                    $("#network_nav").addClass("active");
                    $(window).trigger('resize');
                });
                $("#graph_nav").click(function() {
                    $("#ports").hide();
                    $("#cy").hide();
                    $("#graph").show();
                    $("#graph_nav").addClass("active");
                    $("#ports_nav").removeClass("active");
                    $("#network_nav").removeClass("active");
                    $(window).trigger('resize');
                });
                $("#ports_nav").click(function() {
                    $("#ports").show();
                    $("#cy").hide();
                    $("#graph").hide();
                    $("#graph_nav").removeClass("active");
                    $("#ports_nav").addClass("active");
                    $("#network_nav").removeClass("active");
                    $(window).trigger('resize');
                });
                var chart;
                if (DEMO_MODE) {
                    $.getJSON("static/js/environment.json", function(json){
                        window.data = json;
                        initial(json);
                        (function loop(data) {
                            var rand = Math.round(Math.random() * (9000 - 500)) + 500;
                            setTimeout(function() {
                                    randomUpdate(data);
                                    randomScan(data);
                                    loop(data);
                            }, rand);
                        }(json));
                    });

                }
            });
            //randomUpdate();
            String.prototype.cap = function() { return this.charAt(0).toUpperCase() + this.slice(1); }
            function pad(i) { return (i < 10 ? "0" : "") + i }
            function first(arr) { return arr[0]; }

            var socket = io();
            socket.on('scan', function(data) { scan(data) });
            socket.on('update', function(data) { update(data); });
            socket.on('data', function(data) { initial(data); });
            socket.on('error', console.error.bind(console));
            socket.on('message', console.log.bind(console));

            function buildTables(data) {
                const machines = data["machines"];
                $("#tables").append("<table class=\"ui fixed table\"><thead><tr><th>Machine</th><th>Owner (Username)</th><th>Status</th><th>Services</th></tr></thead><tbody id=\"machines_table\"></tbody></table>");
                for (var name in machines) {
                    const machine = machines[name];
                    const id = machine["id"];
                    const owner = machine["owner"] && machine["owner"] !== "none" ? machine["owner"] : "<span style='color:gray'>Unclaimed</span>";
                    let servicesHtml = "";
                    for (var service in machine["services"]) {
                        const status = machine["services"][service]["status"];
                        const port = machine["services"][service]["port"];
                        let icon = "";
                        let icon_color = "";
                        if (status == "open") {
                            icon = "checkmark";
                            icon_color = "green";
                        } else if (status == "closed") {
                            icon = "remove";
                            icon_color = "red";
                        } else if (status == "issue") {
                            icon = "warning";
                            icon_color = "yellow";
                        }
                        servicesHtml += `<div><i class="icon ${icon_color} ${icon}"></i> ${service} - ${port} (${status})</div>`;
                    }
                    $("#machines_table").append(
                        `<tr>
                            <td>${name}</td>
                            <td>${owner}</td>
                            <td>${machine["status"]}</td>
                            <td>${servicesHtml}</td>
                        </tr>`
                    );
                }
            }
            function updateTables(data) {
                machines = data["machines"];
                console.log("NOW UPDATING MACHINES!");
                console.log(machines);
                for(var name in machines) {
                    machine = machines[name];
                    id = machine["id"]
                    color = machine["color"];
                    $("#"+color+"_"+id.toLowerCase() + "_status").html(machine["status"])
                    $("#"+color+"_"+id.toLowerCase() +"_bar").attr('data-percent', machine["percentage"])
                    $("#"+color+"_"+id.toLowerCase() +"_bar_inner").css("width", machine["percentage"] + "%")

                    for(var service in machine["services"]) {
                        var status = machine["services"][service]["status"];
                        var port = machine["services"][service]["port"];
                        $("#" + color + "_" + id.toLowerCase() + "_" + port).removeClass("positive").removeClass("negative").removeClass("warning");
                        $("#" + color + "_" + id.toLowerCase() + "_" + port + "_icon").removeClass("green").removeClass("yellow").removeClass("red");
                        $("#" + color + "_" + id.toLowerCase() + "_" + port + "_icon").removeClass("checkmark").removeClass("remove").removeClass("warning");
                        if(status == "open") {
                            category = "positive";
                            icon = "checkmark";
                            icon_color = "green"
                        } else if (status == "closed") {
                            category = "negative";
                            icon = "remove";
                            icon_color = "red";
                        } else if (status == "issue") {
                            category = "warning";
                            icon = "warning";
                            icon_color = "yellow";
                        }
                        $("#" + color + "_" + id.toLowerCase() + "_" + port).addClass(category);
                        $("#" + color + "_" + id.toLowerCase() + "_" + port + "_icon").addClass(icon).addClass(icon_color);
                        $("#" + color + "_" + id.toLowerCase() + "_" + port + "_status").html(status);
                    }
                }
            }
            function scan(data) {
                console.log("Received scan data...");
                chart.load({ columns: data["chart"] });
                $("#tables").html("");
                buildTables(data);
                toastr.success("Service check complete.");
            }

            function update(data) {
                console.log("UDPATE RECEIEVED")
                console.log(data);
                cy.$('#'+data["id"]).data('color', data["color"]);
                date = new Date();
                $("#messages").prepend(pad(date.getHours()) + ":" + pad(date.getMinutes()) + ":" + pad(date.getSeconds()) + " - <span class=\"ui " + data["color"] + " small inverted header\">" + data["color"].cap() + "<\/span> team has claimed " + data["id"] + "<br/>");
                updateTables(data);
                $(window).trigger('resize');
            }

            function initial(data) {
                //if (initialized) { return; }
                initialized = true;
                console.log(data);
                buildTables(data);
                buildChart(data);
                buildMessages(data);
                buildcy(data);
                $(window).trigger('resize');
            }
            function buildMessages(data) {
                for(var i = 0; i < data["messages"].length; i++) {
                    console.log(data["messages"][i])
                    $("#messages").prepend(data["messages"][i])
                }
            }
            function buildChart(data) {
                // Chart now uses usernames as series
                chart = c3.generate({
                    bindto: '#chart',
                    data: { columns: data["chart"] }
                });
                chart.resize();
            }

            function buildcy(data) {
                var defaults = {
                    name: 'cose-bilkent',
                    idealEdgeLength: 5,
                    nodeRepulsion: 400000,
                    nodeOverlap : 0,
                    padding: 10,
                    gravity: 100,
                    numIter: 25000,
                    animate: false,
                };
                var cy = window.cy = cytoscape({
                    container: document.getElementById('cy'),
                    ready: function(){},

                    style: cytoscape.stylesheet()
                    .selector('node')
                    .css({
                        'content': function(ele) {
                            var name = ele.data('name');
                            var owner = ele.data('owner');
                            if (owner && owner !== "none") {
                                return name + "\\n(" + owner + ")";
                            } else {
                                return name + "\\n(Unclaimed)";
                            }
                        },
                        'text-valign': 'center',
                        'text-outline-width': 2,
                        'text-outline-color': 'data(color)',
                        'background-color': 'data(color)',
                        'color': '#fff'
                    })
                    .selector(':selected')
                    .css({
                        'border-width': 3,
                        'border-color': '#333'
                    })
                    .selector('edge')
                    .css({
                        'opacity': 0.33,
                        'line-color': 'data(color)',
                    })
                    .selector('.faded')
                    .css({
                        'opacity': 0.25,
                        'text-opacity': 0
                    }),
                    elements: data["graph"],
                });
                cy.layout(defaults);

                cy.elements('node').qtip({
                    content: function() { return "<center><b><u>"+this.data("name")+"<\/u><\/b><br/>" + this.data("ip").join("<br/>") },
                    position: {
                        my: 'top center',
                        at: 'bottom center'
                    },
                    show: {
                        event: 'mouseover'
                    },
                    hide: {
                        event: 'mouseout'
                    },
                    style: {
                        classes: 'qtip-bootstrap',
                        tip: {
                            width: 16,
                            height: 8
                        },
                        "font-size": "14px"
                    }
                });
            }

        </script>
        </head>
        <body>
            <nav class="ui fixed menu inverted navbar">
                <a href="#" class="brand item">King of the Hill</a>
                <a id="network_nav" href="#" class="active item">Network</a>
                <a id="graph_nav" href="#" class="item">Graph</a>
                <a id="ports_nav" href="#" class="item">Ports</a>
                <a id="register_nav" href="register.html" class="item">Register</a>
                <a id="login_nav" href="login.html" class="item">Sign In</a>
                <a id="scoreboard_nav" href="scoreboard.html" class="item">Scoreboard</a>
                <div id="user-info" class="right menu">
                    <!-- Will be filled by JS -->
                  </div>
                  
                </nav>
            <div id="cy"></div>
            <div id="graph">
                <h2 class="ui dividing header">
                    <i class="desktop icon"></i>
                    <div class="content">
                        Leaderboard
                    </div>
                </h2>
                <div id="chart" class="c3"> </div>
            </div>

            <div id="ports">
                <h2 class="ui dividing header">
                    <i class="table icon"></i>
                    <div class="content">
                        Ports List
                    </div>
                </h2>
                <h3>Only claimed machines are scanned. Tables update at each scanning interval.</h3>
                <div id="tables"></div></div>
            <div id="messages" class="ui inverted segment"></div>
            <!-- ✅ Place this just before the closing </body> tag -->
<script>
    fetch('/me', {
      method: 'GET',
      credentials: 'include'
    })
    .then(async response => {
      const loginNav = document.getElementById('login_nav');
      const registerNav = document.getElementById('register_nav');
      const userInfo = document.getElementById('user-info');
  
      if (response.ok) {
        const data = await response.json();
        const username = data.username;
  
        userInfo.innerHTML = `
          <div class="item">👋 Hello, <strong>${username}</strong></div>
          <div class="item">
            <button class="ui red mini button" id="logout_btn">Logout</button>
          </div>
        `;
  
        if (loginNav) loginNav.style.display = 'none';
        if (registerNav) registerNav.style.display = 'none';
  
        document.getElementById('logout_btn').addEventListener('click', () => {
  fetch('/logout', {
    method: 'POST',
    credentials: 'include'
  })
  .then(() => {
    document.cookie = "sessionId=; path=/; expires=Thu, 01 Jan 1970 00:00:00 UTC;";
    window.location.href = 'login.html';
  })
  .catch(err => {
    console.error('Logout failed:', err);
  });
});

  
      } else {
        if (loginNav) loginNav.style.display = '';
        if (registerNav) registerNav.style.display = '';
      }
    })
    .catch(err => {
      console.error('Error checking login status:', err);
    });
  </script>
  
        </body>
    </html>
