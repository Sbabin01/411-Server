<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Scoreboard</title>
    <style>
        body { font-family: Arial, sans-serif; background: #181818; color: #f0f0f0; }
        h1 { text-align: center; }
        table { margin: 2em auto; border-collapse: collapse; width: 60%; background: #222; }
        th, td { padding: 0.75em 1.5em; border-bottom: 1px solid #333; text-align: left; }
        th { background: #333; }
        tr:nth-child(even) { background: #242424; }
        tr:hover { background: #2a2a2a; }
        .rank { text-align: right; color: #aaa; }
        .score { font-weight: bold; }
    </style>
</head>
<body>
    <h1>Scoreboard</h1>
    <table>
        <thead>
            <tr>
                <th class="rank">#</th>
                <th>Username</th>
                <th class="score">Score</th>
            </tr>
        </thead>
        <tbody id="scoreboard-body">
            <!-- Scores will be inserted here -->
        </tbody>
    </table>
    <script>
        async function loadScoreboard() {
            const res = await fetch('/scoreboard-data');
            const data = await res.json();
            const tbody = document.getElementById('scoreboard-body');
            tbody.innerHTML = '';
            data.forEach((entry, idx) => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td class="rank">${idx + 1}</td>
                    <td>${entry.username}</td>
                    <td class="score">${entry.score}</td>
                `;
                tbody.appendChild(tr);
            });
        }
        loadScoreboard();
        setInterval(loadScoreboard, 10000); // Refresh every 10 seconds
    </script>
</body>
</html>
