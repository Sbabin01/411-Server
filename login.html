<!doctype html>
<html>
  <head>
    <title>User Login</title>
    <link rel="stylesheet" type="text/css" href="https://cdnjs.cloudflare.com/ajax/libs/semantic-ui/2.1.8/semantic.min.css">
    <style>
      body {
        background: #f9f9f9;
        padding: 40px;
      }
      .ui.form {
        max-width: 400px;
        margin: 40px auto;
        background: #fff;
        padding: 2em 2em 1em 2em;
        border-radius: 8px;
        box-shadow: 0 2px 8px rgba(0,0,0,0.08);
      }
    </style>
  </head>
  <body>
    <h2 class="ui dividing header">
      <i class="sign in icon"></i>
      <div class="content">
        Sign In
      </div>
    </h2>
    <form class="ui form" id="loginForm">
      <div class="field">
        <label>Username</label>
        <input type="text" name="username" placeholder="Enter username" required>
      </div>
      <div class="field">
        <label>Password</label>
        <input type="password" name="password" placeholder="Enter password" required>
      </div>
      <button class="ui primary button" type="submit">Login</button>
    </form>
    <div id="message" class="ui message" style="display:none;"></div>
    <div style="margin-top: 1em;">
      <a href="register.html">Don't have an account? Register</a>
    </div>
    <script>
      document.getElementById('loginForm').addEventListener('submit', function(e) {
        e.preventDefault();
        const form = e.target;
        const username = form.username.value;
        const password = form.password.value;
        fetch('/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        })
        .then(async response => {
          const text = await response.text();
          document.getElementById('message').style.display = 'block';
          if (response.ok) {
            document.getElementById('message').className = 'ui positive message';
            document.getElementById('message').textContent = text;
            form.reset();
          } else {
            document.getElementById('message').className = 'ui negative message';
            document.getElementById('message').textContent = text;
          }
        })
        .catch(err => {
          document.getElementById('message').style.display = 'block';
          document.getElementById('message').className = 'ui negative message';
          document.getElementById('message').textContent = 'Login failed. Please try again.';
        });
      });
    </script>
  </body>
</html>
